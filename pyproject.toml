[project]
name = "homeassistant-myjdownloader"
version = "3.0.0.dev6"
description = "MyJDownloader custom integration for Home Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".git", ".venv*"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["custom_components.myjdownloader"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["custom_components/myjdownloader"]

[[tool.mypy.overrides]]
# myjdapi ships no type information yet.
module = ["myjdapi", "myjdapi.*"]
ignore_missing_imports = true

[tool.ruff]
required-version = ">=0.16.3"
target-version = "py314"
extend-exclude = [".venv*"]

