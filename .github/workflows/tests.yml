name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install -r requirements_test.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      # Informational until the Phase B rewrite; made blocking afterwards.
      - run: mypy
        continue-on-error: true

  pytest:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: latest
            phcc: ""
          - ha: minimum
            phcc: "0.13.357" # homeassistant 2026.8.3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install -r requirements_test.txt
      - if: matrix.phcc != ''
        run: uv pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
